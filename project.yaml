title: "ParentLink"
summary: "ParentLink is an app that helps parents, teachers and administrators at Nativity Girls School (NGS) to share attendance, grades, behavior reports, check-in and check-out times, announcements and the school year schedule, and to message each other, so parents stay informed about their child without depending on lost letters and scattered channels."
